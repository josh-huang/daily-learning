name: Nightly Check

on:
  schedule:
    # 00:00 UTC+8 = 16:00 UTC
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test integrity reporting
        run: python -m unittest discover -s scripts/tests -v

      - name: Run integrity check
        id: check
        run: python scripts/check_integrity.py > integrity.json
        # Findings produce exit 1, but the JSON report is still ready to publish.
        continue-on-error: true

      - name: Create issues for findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/create_issues.py integrity.json
